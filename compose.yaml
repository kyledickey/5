name: quack

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quack
      MYSQL_USER: quack
      MYSQL_PASSWORD: quack
      MYSQL_ROOT_PASSWORD: quack-root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    profiles:
      - app
    build:
      context: ./apps/backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      API_PORT: ${API_PORT:-8080}
      OPS_STATUS_TOKEN: ${OPS_STATUS_TOKEN:-}
      DATABASE_DSN: quack:quack@tcp(mysql:3306)/quack?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_URL: redis://redis:6379/0
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_APP_ID: ${DISCORD_APP_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI:-http://localhost:8080/auth/discord/callback}
      DISCORD_OAUTH_SCOPES: ${DISCORD_OAUTH_SCOPES:-identify guilds}
      DISCORD_COMMAND_GUILD_ID: ${DISCORD_COMMAND_GUILD_ID:-}
      DISCORD_COMMAND_PRUNE: ${DISCORD_COMMAND_PRUNE:-false}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-quack_session}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-168}
      AUTH_STATE_TTL_MINUTES: ${AUTH_STATE_TTL_MINUTES:-10}
      AUTH_POST_LOGIN_REDIRECT: ${AUTH_POST_LOGIN_REDIRECT:-/}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      EVENT_QUEUE_SIZE: ${EVENT_QUEUE_SIZE:-1000}
      EVENT_QUEUE_WORKERS: ${EVENT_QUEUE_WORKERS:-3}
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${API_PORT:-8080}/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
  redis-data:
